- id: djangofmt
  name: Djangofmt
  description: "A fast, HTML aware, Django template formatter, written in Rust"
  entry: djangofmt
  language: python
  files: '(^|/)templates/'
  types_or: [text]
  exclude_types: [python]
  require_serial: true
  minimum_pre_commit_version: "2.9"

- id: djangofmt-svg
  name: Djangofmt (svg)
  description: "A fast, HTML aware, Django template formatter, written in Rust"
  entry: djangofmt
  language: python
  types: [svg]
  require_serial: true
  minimum_pre_commit_version: "2.9"
